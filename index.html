<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#fff;font-family:'Poppins',sans-serif;min-height:100vh;
  display:flex;justify-content:center;align-items:center;color:#111;
  padding:20px
}
.container{text-align:center;padding:20px;max-width:420px;width:100%}
.logo{
  width:130px;height:130px;border-radius:50%;object-fit:cover;
  box-shadow:0 8px 30px rgba(0,0,0,.08)
}
.brand{margin-top:28px;font-size:32px;font-weight:300;letter-spacing:3px}
.headline{margin-top:18px;font-size:18px;font-weight:300;line-height:1.8;color:#444}
.timer{margin-top:25px;font-size:13px;color:#777}
#count{font-weight:600;color:#229ED9}
.cta{
  display:block;margin:22px auto 0;text-decoration:none;background:#229ED9;
  color:#fff;padding:15px 24px;border-radius:999px;font-size:15px;
  font-weight:500;transition:.2s;box-shadow:0 6px 20px rgba(34,158,217,.15);
  max-width:280px
}
.cta:hover{transform:translateY(-2px)}
.cta:focus-visible{outline:3px solid #111;outline-offset:4px}
.status{font-size:12px;color:#777;margin-top:12px;min-height:18px}
.footer{margin-top:45px;font-size:12px;color:#999;letter-spacing:1px}
@media(max-width:480px){
  .logo{width:110px;height:110px}
  .brand{font-size:26px;letter-spacing:2px}
  .headline{font-size:16px}
}
</style>
</head>

<body>
<main class="container">
  <img
    src="https://mannattiwari2008-stack.github.io/GMKAJAL/kajallp.jpg"
    alt="Earn With Kajal logo"
    class="logo"
  >

  <div class="brand">𝐄𝐀𝐑𝐍 𝐖𝐈𝐓𝐇 𝐊𝐀𝐉𝐀𝐋</div>
  <div class="headline">Kajal didi Ka Sytum</div>

  <div class="timer">
    Link refreshes in <span id="count">10</span> seconds
  </div>

  <a id="joinButton" class="cta" href="#" target="_blank"
     rel="noopener noreferrer" aria-disabled="true">
    LOADING...
  </a>

  <div id="status" class="status" role="status" aria-live="polite">
    Connecting...
  </div>

  <div class="footer">Ads Managed by GM ADS</div>
</main>

<script>
const API_URL =
  "https://telegram-landing-api.mannattiwari2008.workers.dev/api/destination?slug=default";

const button = document.getElementById("joinButton");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");

let seconds = 10;
let destination = "";
let requestInProgress = false;

async function refreshDestination() {
  if (requestInProgress) return;
  requestInProgress = true;

  try {
    const response = await fetch(API_URL, {cache:"no-store"});
    const data = await response.json();

    if (!response.ok || !data.ok || !data.destination) {
      throw new Error(data.error || "Destination unavailable");
    }

    // Only allow Telegram HTTPS links
    const parsed = new URL(data.destination);
    if (parsed.protocol !== "https:" ||
        parsed.hostname !== "t.me") {
      throw new Error("Invalid Telegram destination");
    }

    destination = parsed.href;
    button.href = destination;
    button.textContent = data.buttonText || "JOIN TELEGRAM";
    button.style.background = data.theme || "#229ED9";
    button.setAttribute("aria-disabled","false");
    statusEl.textContent = "Telegram link ready";
  } catch (error) {
    statusEl.textContent = "Unable to load link. Retrying...";
    button.removeAttribute("href");
    button.setAttribute("aria-disabled","true");
    destination = "";
  } finally {
    requestInProgress = false;
  }
}

button.addEventListener("click", function(event) {
  if (!destination) {
    event.preventDefault();
    statusEl.textContent = "Please wait for the link to load.";
  }
});

setInterval(function() {
  seconds--;
  if (seconds <= 0) {
    seconds = 10;
    refreshDestination();
  }
  countEl.textContent = seconds;
}, 1000);

refreshDestination();
</script>
</body>
</html>
