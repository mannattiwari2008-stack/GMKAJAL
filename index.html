<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#fff;font-family:'Poppins',sans-serif;min-height:100vh;
  display:flex;justify-content:center;align-items:center;color:#111;padding:20px
}
.container{text-align:center;padding:20px;max-width:420px;width:100%}
.logo{
  width:130px;height:130px;border-radius:50%;object-fit:cover;
  box-shadow:0 8px 30px rgba(0,0,0,.08)
}
.brand{margin-top:28px;font-size:32px;font-weight:300;letter-spacing:3px}
.headline{margin-top:18px;font-size:18px;font-weight:300;line-height:1.8;color:#444}
.timer{margin-top:25px;font-size:13px;color:#777}
#count{font-weight:600;color:#229ED9}
.cta{
  display:block;margin:22px auto 0;background:#229ED9;color:#fff;
  padding:15px 24px;border-radius:999px;font-size:15px;font-weight:500;
  transition:.2s;box-shadow:0 6px 20px rgba(34,158,217,.15);
  max-width:280px;width:100%;border:0;cursor:pointer;font-family:inherit
}
.cta:hover{transform:translateY(-2px)}
.cta:disabled{opacity:.65;cursor:wait;transform:none}
.status{font-size:12px;color:#777;margin-top:12px;min-height:36px;line-height:1.6}
.footer{margin-top:45px;font-size:12px;color:#999;letter-spacing:1px}
@media(max-width:480px){
  .logo{width:110px;height:110px}
  .brand{font-size:26px;letter-spacing:2px}
  .headline{font-size:16px}
}

<body>
<main class="container">
  <img
    src="https://mannattiwari2008-stack.github.io/GMKAJAL/kajallp.jpg"
    alt="Earn With Kajal logo"
    class="logo"
  >

  <div class="brand">𝐄𝐀𝐑𝐍 𝐖𝐈𝐓𝐇 𝐊𝐀𝐉𝐀𝐋</div>
  <div class="headline">Kajal didi Ka Sytum</div>

  <div class="timer">
    Link refreshes in <span id="count">10</span> seconds
  </div>

  <button id="joinButton" class="cta" type="button" disabled>
    PREPARING INVITE...
  </button>

  <div id="status" class="status" role="status" aria-live="polite">
    Preparing your Telegram invite. Please wait...
  </div>

  <div class="footer">Ads Managed by GM ADS</div>
</main>

<script>
const WORKER =
  "https://telegram-landing-api.mannattiwari2008.workers.dev";

const button = document.getElementById("joinButton");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");

let readyInvite = null;
let readyEventId = null;
let preparing = false;
let seconds = 10;
let refreshBusy = false;

function uuid() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : "evt-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function getCookie(name) {
  const entry = document.cookie.split("; ")
    .find(v => v.startsWith(name + "="));
  return entry ? decodeURIComponent(entry.slice(name.length + 1)) : "";
}

function validTelegramUrl(value) {
  try {
    const u = new URL(value);
    return u.protocol === "https:" &&
      ["t.me", "www.t.me", "telegram.me"].includes(u.hostname) &&
      u.pathname !== "/";
  } catch {
    return false;
  }
}

// This GET keeps the 10-second destination rotation running.
async function refreshDestination() {
  if (refreshBusy) return;
  refreshBusy = true;

  try {
    const r = await fetch(
      WORKER + "/api/destination?slug=default&_=" + Date.now(),
      {cache:"no-store"}
    );
    const data = await r.json();

    if (!r.ok || !data.ok) throw new Error("Refresh failed");

    button.style.background = data.theme || "#229ED9";
  } catch (e) {
    console.warn("Destination refresh failed", e);
  } finally {
    refreshBusy = false;
  }
}

// Generate the next single-use invite BEFORE the next click.
async function prepareInvite() {
  if (preparing || readyInvite) return;
  preparing = true;

  button.disabled = true;
  button.textContent = "PREPARING INVITE...";
  statusEl.textContent = "Preparing your next Telegram invite...";

  const eventId = uuid();

  try {
    const r = await fetch(WORKER + "/api/new-invite", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      cache: "no-store",
      body: JSON.stringify({
        slug: "default",
        eventId,
        fbp: getCookie("_fbp"),
        fbc: getCookie("_fbc")
      })
    });

    const data = await r.json();

    if (!r.ok || !data.ok || !validTelegramUrl(data.destination)) {
      throw new Error(data.error || "Invite creation failed");
    }

    readyInvite = data.destination;
    readyEventId = data.eventId || eventId;

    button.disabled = false;
    button.textContent = "JOIN TELEGRAM";
    statusEl.textContent = "Invite ready. Tap to open Telegram.";
  } catch (e) {
    console.error("Invite preparation failed", e);
    button.disabled = false;
    button.textContent = "RETRY INVITE";
    statusEl.textContent = "Invite preparation failed. Tap to retry.";
  } finally {
    preparing = false;
  }
}

button.addEventListener("click", function() {
  // No network wait here. Use the invite already prepared.
  if (!readyInvite) {
    prepareInvite();
    statusEl.textContent = "Please wait until the invite is ready.";
    return;
  }

  const invite = readyInvite;
  const eventId = readyEventId;

  readyInvite = null;
  readyEventId = null;

  // Open synchronously during the real user click.
  const tab = window.open(invite, "_blank");

  if (tab) {
    tab.opener = null;
  } else {
    // Browser popup fallback.
    window.location.assign(invite);
  }

  // Pixel event shares the ID returned for this invite.
  if (typeof window.fbq === "function") {
    fbq(
      "trackCustom",
      "TelegramInviteIssued",
      {content_name:"EARN WITH KAJAL"},
      {eventID:eventId}
    );
  }

  // Prepare another unique invite for the next click.
  prepareInvite();
});

refreshDestination();
prepareInvite();

// Refresh displayed destination metadata every 10 seconds.
setInterval(function() {
  seconds--;

  if (seconds <= 0) {
    seconds = 10;
    refreshDestination();
  }

  countEl.textContent = seconds;
}, 1000);
</script>
</body>
