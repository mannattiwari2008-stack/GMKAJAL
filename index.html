<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#fff;font-family:'Poppins',sans-serif;min-height:100vh;
  display:flex;justify-content:center;align-items:center;color:#111;padding:20px
}
.container{text-align:center;padding:20px;max-width:420px;width:100%}
.logo{
  width:130px;height:130px;border-radius:50%;object-fit:cover;
  box-shadow:0 8px 30px rgba(0,0,0,.08)
}
.brand{margin-top:28px;font-size:32px;font-weight:300;letter-spacing:3px}
.headline{margin-top:18px;font-size:18px;font-weight:300;line-height:1.8;color:#444}
.timer{margin-top:25px;font-size:13px;color:#777}
#count{font-weight:600;color:#229ED9}
.cta{
  display:block;margin:22px auto 0;text-decoration:none;background:#229ED9;
  color:#fff;padding:15px 24px;border-radius:999px;font-size:15px;
  font-weight:500;transition:.2s;box-shadow:0 6px 20px rgba(34,158,217,.15);
  max-width:280px;width:100%;border:0;cursor:pointer;font-family:inherit
}
.cta:hover{transform:translateY(-2px)}
.cta:disabled{opacity:.65;cursor:wait;transform:none}
.cta:focus-visible{outline:3px solid #111;outline-offset:4px}
.status{font-size:12px;color:#777;margin-top:12px;min-height:36px;line-height:1.6}
.footer{margin-top:45px;font-size:12px;color:#999;letter-spacing:1px}
@media(max-width:480px){
  .logo{width:110px;height:110px}
  .brand{font-size:26px;letter-spacing:2px}
  .headline{font-size:16px}
}

<body>
<main class="container">
  <img
    src="https://mannattiwari2008-stack.github.io/GMKAJAL/kajallp.jpg"
    alt="Earn With Kajal logo"
    class="logo"
  >

  <div class="brand">𝐄𝐀𝐑𝐍 𝐖𝐈𝐓𝐇 𝐊𝐀𝐉𝐀𝐋</div>
  <div class="headline">Kajal didi Ka Sytum</div>

  <div class="timer">
    Link refreshes in <span id="count">10</span> seconds
  </div>

  <button id="joinButton" class="cta" type="button">
    JOIN TELEGRAM
  </button>

  <div id="status" class="status" role="status" aria-live="polite">
    Connecting...
  </div>

  <div class="footer">Ads Managed by GM ADS</div>
</main>

<script>
const WORKER_URL =
  "https://telegram-landing-api.mannattiwari2008.workers.dev";

const button = document.getElementById("joinButton");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");

let seconds = 10;
let currentDestination = "";
let refreshing = false;
let creatingInvite = false;

function isTelegramLink(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" &&
      ["t.me", "www.t.me", "telegram.me"].includes(url.hostname) &&
      url.pathname !== "/";
  } catch {
    return false;
  }
}

// Refresh the displayed destination every 10 seconds.
// This GET uses the rotating destination pool.
async function refreshDestination() {
  if (refreshing) return;
  refreshing = true;

  try {
    const response = await fetch(
      WORKER_URL + "/api/destination?slug=default&_=" + Date.now(),
      { method: "GET", cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.ok ||
        !isTelegramLink(data.destination)) {
      throw new Error(data.error || "Destination refresh failed");
    }

    currentDestination = data.destination;
    button.dataset.destination = currentDestination;
    button.style.background = data.theme || "#229ED9";

    statusEl.textContent = "Telegram destination refreshed.";
  } catch (error) {
    console.error("Destination refresh failed:", error);
    statusEl.textContent =
      "Auto-refresh failed. Join button can still request a fresh invite.";
  } finally {
    refreshing = false;
  }
}

// Every button click requests a brand-new single-use invite.
button.addEventListener("click", async function () {
  if (creatingInvite) return;

  creatingInvite = true;
  button.disabled = true;
  button.textContent = "CREATING INVITE...";
  statusEl.textContent = "Creating your private Telegram invite...";

  try {
    const response = await fetch(
      WORKER_URL + "/api/new-invite",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: "default" }),
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok || !data.ok ||
        !isTelegramLink(data.destination)) {
      throw new Error(data.error || "Could not create invite");
    }

    // This tracks invite issuance, not a confirmed Telegram join.
    if (typeof window.fbq === "function") {
      window.fbq("trackCustom", "TelegramInviteIssued");
    }

    statusEl.textContent = "Opening Telegram...";
    window.location.assign(data.destination);

  } catch (error) {
    console.error("New invite request failed:", error);
    statusEl.textContent =
      error.message || "Invite creation failed. Please try again.";

    button.textContent = "TRY AGAIN";
    button.disabled = false;
    creatingInvite = false;
  }
});

// Initial destination load.
refreshDestination();

// Countdown and automatic destination refresh.
setInterval(function () {
  seconds--;

  if (seconds <= 0) {
    seconds = 10;
    refreshDestination();
  }

  countEl.textContent = seconds;
}, 1000);
</script>
</body>
